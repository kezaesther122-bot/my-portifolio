<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Portfolio</title>
  <!-- Google Fonts: Playfair Display (titles) and DM Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── Navigation ──────────────────────────────────────────────────────── -->
  <header class="site-header">
    <nav class="nav">
      <a class="nav__logo" href="/">Portfolio</a>
      <button
        id="menuButton"
        class="nav__menu-btn"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navMenu"
      >&#9776;</button>
      <ul id="navMenu" class="nav__menu" role="list">
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ─── Hero / Home ─────────────────────────────────────────────────────── -->
  <section id="home" class="hero" aria-label="Home">
    <div class="hero__image-wrap">
      <img
        src="photos /keza-hero. jpg.jpg"
        alt="Keza Esther — portrait"
        class="hero__photo"
      >
    </div>
    <div class="hero__text">
      <h1 class="hero__name">KEZA ESTHER</h1>
      <div class="hero__roles" aria-label="Roles">
        <span class="hero__role" style="--i:0">Photographer</span>
        <span class="hero__role" style="--i:1">UI &amp; UX Designer</span>
        <span class="hero__role" style="--i:2">Graphics Designer</span>
      </div>
    </div>
  </section>

  <!-- ─── Gallery ─────────────────────────────────────────────────────────── -->
  <!-- buildPhotoSequence() queries: article.photo img, .photo-info h3, .photo-info span -->
  <main>
    <section id="gallery" class="gallery" aria-label="Photo gallery">

      <article class="photo">
        <img
          src="photos /8M1A3782.jpg"
          alt="Photo 1"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo I</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /8M1A3847 1.jpg"
          alt="Photo 2"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo II</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /8M1A4952.jpg"
          alt="Photo 3"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo III</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /BWM.jpg"
          alt="Photo 4"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo IV</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /PAU_5328.jpg"
          alt="Photo 5"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo V</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /PAU_5370.jpg"
          alt="Photo 6"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo VI</h3>
          <span>Portfolio</span>
        </div>
      </article>

      <article class="photo">
        <img
          src="photos /_M1A7617.jpg"
          alt="Photo 7"
          loading="lazy"
        >
        <div class="photo-info">
          <h3>Photo VII</h3>
          <span>Portfolio</span>
        </div>
      </article>

    </section>
  </main>

  <!-- ─── Scripts ─────────────────────────────────────────────────────────── -->
  <!-- Script tag at the bottom of <body> so the DOM is ready before the
       DOMContentLoaded listener fires (also works with the event itself). -->
  <script src="script.js"></script>
</body>
</html>
