<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keza Esther — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ─── Navigation ──────────────────────────────────────────────────────── -->
  <header class="site-header">
    <nav class="nav">
      <a class="nav__logo" href="index.html">Kesie Media</a>
      <button
        id="menuButton"
        class="nav__menu-btn"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navMenu"
      >&#9776;</button>
      <ul id="navMenu" class="nav__menu" role="list">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <!-- Music toggle -->
      <button id="musicToggle" aria-label="Pause background music" title="Toggle background music">
        <svg id="musicIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- ─── Hero / Home ─────────────────────────────────────────────────────── -->
  <section id="home" class="hero" aria-label="Home" style="--hero-bg: url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1920&q=80')">
    <div class="hero__image-wrap">
      <img
        src="photos /keza-hero. jpg.jpg"
        alt="Keza Esther — portrait"
        class="hero__photo"
      >
    </div>
    <div class="hero__text">
      <h1 class="hero__name">KEZA ESTHER</h1>
      <div class="hero__roles" aria-label="Roles">
        <span class="hero__role" style="--i:0">Photographer</span>
        <span class="hero__role" style="--i:1">UI &amp; UX Designer</span>
        <span class="hero__role" style="--i:2">Graphics Designer</span>
      </div>
    </div>

    <!-- Collaborators -->
    <div class="hero__collabs" aria-label="Collaborators">
      <p class="hero__collabs-label">Collaborating with</p>
      <div class="hero__collabs-list">
        <a class="hero__collab-card" href="https://textech.vercel.app/" target="_blank" rel="noopener noreferrer">
          <span class="hero__collab-name">TEX-TECH</span>
          <span class="hero__collab-desc">Brand Identity &amp; Web Development</span>
        </a>
        <a class="hero__collab-card" href="https://my-portifolio-woad.vercel.app/" target="_blank" rel="noopener noreferrer">
          <span class="hero__collab-name">Mugabi Dunset</span>
          <span class="hero__collab-desc">Full-Stack Developer</span>
        </a>
      </div>
    </div>
  </section>

  <audio id="bgMusic" src="bg.mp3" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
